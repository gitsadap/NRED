{% extends "layout.html" %}

{% block content %}
<!-- Activity Detail Header -->
<section class="bg-gray-900 text-white py-20">
    <div class="container mx-auto px-4 text-center">
        <h1 class="text-3xl md:text-5xl font-serif font-bold mb-4 leading-tight">{{ activity.title }}</h1>
        <div class="text-gray-400 text-sm">
            โพสต์เมื่อ: {{ activity.created_at.strftime('%d %B %Y') }}
        </div>
    </div>
</section>

<!-- Content -->
<article class="bg-white py-16">
    <div class="container mx-auto px-4 max-w-5xl">

        <div class="prose prose-xl prose-green mx-auto mb-12 text-center text-gray-700">
            {{ activity.content | safe }}
        </div>

        {% if activity.image_url %}
        <div class="rounded-xl overflow-hidden shadow-xl mb-8 relative group">
            <img src="{{ activity.image_url }}" alt="{{ activity.title }}" class="w-full h-auto">
            <!-- Share Arrow Button on Thumbnail -->
            <button type="button"
                onclick="event.preventDefault(); event.stopPropagation(); window.openShareModal({ title: '{{ activity.title | replace("'", "\\'") | replace('"', '&quot;') }}', url: window.location.href });"
                class="absolute top-4 right-4 inline-flex items-center gap-2 px-4 py-2 rounded-full bg-black/60 hover:bg-emerald-600 text-white backdrop-blur-md shadow-lg transition-all duration-300 hover:scale-105 active:scale-95 border border-white/25 z-30 font-medium text-xs group/share"
                title="แชร์กิจกรรมนี้"
                aria-label="แชร์กิจกรรมนี้">
                <svg class="w-4 h-4 transition-transform group-hover/share:translate-x-0.5 group-hover/share:-translate-y-0.5" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M14 8.5V4.5L21.5 12L14 19.5V15.5C8 15.5 4 17.5 1 22C2.5 16 6 10 14 8.5Z"/>
                </svg>
                <span>แชร์กิจกรรมนี้</span>
            </button>
        </div>
        {% endif %}

        <div class="flex flex-col sm:flex-row items-center justify-center gap-4 mt-12">
            <a href="/news"
                class="inline-block px-8 py-3 bg-gray-100 text-gray-800 font-bold rounded-full hover:bg-gray-200 transition">←
                กลับไปหน้ากิจกรรมรวม</a>
            <button type="button"
                onclick="window.openShareModal({ title: '{{ activity.title | replace("'", "\\'") | replace('"', '&quot;') }}', url: window.location.href });"
                class="inline-flex items-center gap-2 px-6 py-3 rounded-full bg-emerald-700 hover:bg-emerald-800 text-white font-semibold text-sm shadow-md hover:shadow-lg transition-all duration-300 hover:-translate-y-0.5 active:translate-y-0">
                <svg class="w-4 h-4" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M14 8.5V4.5L21.5 12L14 19.5V15.5C8 15.5 4 17.5 1 22C2.5 16 6 10 14 8.5Z"/>
                </svg>
                <span>แชร์กิจกรรมนี้</span>
            </button>
        </div>
    </div>
</article>
{% endblock %}
